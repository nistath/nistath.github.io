# pdf_url takes an https address or a path to a file in this repository.
# A same-origin path (/files/resume.pdf, say) is the more reliable of the
# two: the rendered viewer below has to fetch the bytes itself, and another
# host only permits that if it sends CORS headers.
pdf_url: https://www.dropbox.com/scl/fi/d1e7agwsxeq2i67ctfni0/Nick_Stathas_Resume.pdf?rlkey=62hsxcdpka3mh9gakokisj11a&st=s0g5y8mn&raw=1#page=1&view=FitH
title: Nick Stathas Resume

# Browsers with no inline PDF viewer of their own — every browser on iOS —
# get the pages rendered into the site instead, so nobody has to leave it to
# read the resume.
viewer:
  loading: Rendering the résumé…
  action: Open the original PDF

# Last resort, shown only if the file cannot be fetched at all.
fallback:
  heading: Resume
  description: >-
    This browser could not show the résumé inline. It opens fine in your own
    PDF viewer.
  action: Open the PDF
