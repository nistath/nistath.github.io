# ────────────────────────────────────────────────────────────────────
# Portfolio content. Each entry under `projects:` becomes one card,
# in order. See content/README.md for the full editing guide.
#
#   icon:  the name of a pixel-art icon defined in build/templates/icons.js
#          (adding a new icon is a coding-agent task)
#   color: the card accent color (always "quote" hex colors — a bare #
#          starts a YAML comment)
#   Prose supports **bold**, *italic*, and [label](https://links).
# ────────────────────────────────────────────────────────────────────

intro:
  title: Portfolio
  sub: Selected projects and work — click any row to expand

projects:

  - id: salient
    color: "#7c3aed"
    icon: salient
    title: SALIENT
    subtitle: Distributed multi-GPU graph neural network acceleration
    org: MIT-IBM Watson AI Lab
    period: 2020 – 2021
    tags: [PyTorch, C++, CUDA, Distributed Systems, GNNs, MLSys 2022]
    bullets:
      - >-
        Led design and implementation of SALIENT, a distributed multi-GPU
        system for training and inference of graph neural networks (GNNs)
        on massive graphs.
      - >-
        Achieves a drop-in **3× performance improvement** over an optimized
        PyTorch Geometric baseline, with notable speedups over competing
        distributed systems.
      - >-
        Optimized PyG’s C++ neighborhood sampling code and designed a
        GIL-free thread-based parallelization strategy for non-blocking
        data loading.
      - >-
        Co-authored *Accelerating Training and Inference of Graph Neural
        Networks with Fast Sampling and Pipelining*, presented at
        **MLSys 2022** and featured in MIT News.
    links:
      - label: MLSys 2022 Paper
        url: https://proceedings.mlsys.org/paper_files/paper/2022/hash/35f4a8d465e6e1edc05f3d8ab658c551-Abstract.html
      - label: GitHub
        url: https://github.com/MITIBMxGraph/SALIENT
      - label: MIT News
        url: https://news.mit.edu/2022/accelerating-graph-neural-network-training-0519

  - id: my18
    color: "#c0392b"
    icon: car
    title: MY18 Electric Race Car
    subtitle: Software lead for MIT’s Formula SAE championship entry
    org: MIT Motorsports
    period: Nov. 2017 – June 2018
    tags: [C++, CAN Bus, Embedded, Team Lead, Formula SAE]
    bullets:
      - >-
        Led and coordinated 8 engineers across 9 software subsystems of
        MIT’s electric race car.
      - >-
        The car finished the 22 km Formula SAE Electric 2018 endurance
        race **113 seconds ahead** of the next fastest competitor.
      - >-
        Built *CANlib* — a code-generated CAN bus serialization library —
        alongside Makefile improvements, automated toolchain installation,
        and Git-versioned binary flashing.
      - >-
        Developed documentation, unit and integration tests, and
        verification procedures for the car’s electrical systems.
      - >-
        Held regular individual status reviews and all-hands architecture
        sessions.
    links:
      - label: MIT Motorsports
        url: https://www.mitmotorsports.com/

  - id: my19-bms
    color: "#0a7c5c"
    icon: bms
    title: MY19 Battery Management System
    subtitle: High-voltage BMS and data acquisition for an electric racer
    org: MIT Motorsports
    period: 2017 – 2020
    tags: [C++, STM32F413, LTC6813, CAN Bus, DMA, Python, NumPy, MATLAB]
    bullets:
      - >-
        Implemented C++ drivers for a daisy chain of **LTC6813** multicell
        battery monitor ICs, enabling precise per-cell voltage and
        temperature monitoring.
      - >-
        Designed a custom STM32F413-based data logger using **DMA** for
        simultaneous high-throughput SD card logging of internal messages
        and CAN bus traffic.
      - >-
        Built a Python data pipeline for storing, tagging, and parsing
        logs into MATLAB or NumPy formats for post-race analysis.
      - >-
        Created a modern CAN bus **serialization specification language**
        and accompanying Python code-generation framework used across the
        team.
    links:
      - label: MIT Motorsports
        url: https://www.mitmotorsports.com/

  - id: my19-dash
    color: "#1a56a0"
    icon: dash
    title: MY19 Dashboard & Telemetry
    subtitle: Real-time driver HUD and live pit-side telemetry system
    org: MIT Motorsports
    period: 2017 – 2020
    tags: [kdb+, Q, Kx Dashboards, Python, CAN Bus, Real-time, Embedded]
    bullets:
      - >-
        Designed the driver-facing dashboard display surfacing battery
        state, motor metrics, system alerts, and lap data in a glanceable
        layout.
      - >-
        Developed a kdb+/Q real-time telemetry pipeline ingesting live CAN
        bus data wirelessly to a pit-side system during competition.
    links:
      - label: MIT Motorsports
        url: https://www.mitmotorsports.com/
    sub_items:
      - id: pit-telemetry
        title: Pit Telemetry System
        paragraphs:
          - >-
            Built a real-time telemetry pipeline using kdb+/Q that ingests
            live CAN bus data wirelessly from the car to a pit-side laptop
            throughout dynamic events.
          - >-
            Visualised vehicle state — motor temperatures, battery cell
            voltages, current draw, and fault codes — using Kx Dashboards,
            enabling engineers to monitor and diagnose the car live from
            the pits.
      - id: driver-display
        title: Driver Dashboard Display
        paragraphs:
          - >-
            Designed and implemented the embedded dashboard display shown
            to the driver throughout competition.
          - >-
            The display surfaces critical alerts, battery state of charge,
            lap timing, and key motor metrics within a clear layout
            optimised for high-vibration, high-G environments.
