nav:
  label: More Islands
  icon: 🏝️
title: Other Islands Worth Knowing

body:
  - type: other_cards
    items:
      - name: Milos
        description: >-
          Volcanic coastline, sea caves, colorful beaches. [Sarakiniko](map:Sarakiniko Beach Milos)’s white lunar landscape is iconic. Quieter, rugged — great for couples.
        image:
          src: https://upload.wikimedia.org/wikipedia/commons/2/24/Milos_Sarakiniko.JPG
          alt: Sarakiniko Beach, Milos
          aspect: 16/7
      - name: Rhodes
        description: >-
          Rhodes offers the [Medieval Old Town](map:Rhodes Old Town)–a walled-city UNESCO site, Beaches, [ancient Lindos](map:Lindos Acropolis Rhodes), and a different vibe from the Cyclades.
        image:
          src: https://upload.wikimedia.org/wikipedia/commons/6/6e/Rhodes_old_town_Greece_6.jpg
          alt: Rhodes Old Town
          aspect: 16/7
      - name: Corfu
        description: >-
          Northwest, closer to Italy. Venetian influence, lush green hills, elegant architecture around [Corfu Old Town](map:Corfu Old Town). Longer journey but completely different.
        image:
          src: https://upload.wikimedia.org/wikipedia/commons/4/4e/The_Old_Town_of_Corfu.jpg
          alt: Corfu Old Town
          aspect: 16/7
      - name: Zakynthos
        description: >-
          Also off the West coast. Famous for its [Navagio Beach](map:Navagio Beach Zakynthos) with the shipwreck, dramatic cliffs, and vibrant nightlife. Ideal for both relaxation and adventure.
        image:
          src: https://upload.wikimedia.org/wikipedia/commons/5/5d/Navagio_beach_Zakynthos_3.jpg
          alt: Navagio Beach, Zakynthos
          aspect: 16/7

