title: Other Islands Worth Knowing

body:
  - type: other_cards
    items:
      - name: Milos
        description: >-
          Volcanic coastline, sea caves, colorful beaches. [Sarakiniko](map:Sarakiniko Beach Milos)’s white lunar landscape is iconic. Quieter, rugged — great for couples.
        image:
          src: https://upload.wikimedia.org/wikipedia/commons/2/24/Milos_Sarakiniko.JPG
          alt: Sarakiniko Beach, Milos
          aspect: 16/7
      - name: Rhodes
        description: >-
          [Medieval Old Town](map:Rhodes Old Town) is a UNESCO site — a walled city for hours. Beaches, [ancient Lindos](map:Lindos Acropolis Rhodes), different vibe from the Cyclades.
        image:
          src: https://upload.wikimedia.org/wikipedia/commons/6/6e/Rhodes_old_town_Greece_6.jpg
          alt: Rhodes Old Town
          aspect: 16/7
      - name: Corfu
        description: >-
          Northwest, closer to Italy. Venetian influence, lush green hills, elegant architecture around [Corfu Old Town](map:Corfu Old Town). Longer journey but completely different.
        image:
          src: https://upload.wikimedia.org/wikipedia/commons/4/4e/The_Old_Town_of_Corfu.jpg
          alt: Corfu Old Town
          aspect: 16/7

