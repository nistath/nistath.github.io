id: santorini
order: 50
kind: island
nav:
  label: Santorini
  icon: 🌅
title: Santorini
tagline: Dramatic cliffs, legendary sunsets, real depth
image:
  src: https://commons.wikimedia.org/wiki/Special:FilePath/07-17-2012_-_Oia_-_Santorini_-_Greece_-_19.jpg?width=900
  alt: Oia blue domes at sunset, Santorini
  aspect: 16/9

body:
  - type: prose
    text: Built on a volcanic caldera — cliffs into deep blue water, white buildings stacked together. Romantic, photogenic, historically rich.

  - type: heading
    text: Where to Stay

  - type: prose
    text: >-
      [**Fira**](map:Fira Santorini) is lively. [**Oia**](map:Oia Santorini) is fancier with the iconic sunset. Stay along the caldera coast between them for a middle ground.

  - type: heading
    text: Things to Do

  - type: image
    src: https://commons.wikimedia.org/wiki/Special:FilePath/Hiking_Santorini_(7449565644).jpg?width=900
    alt: Fira to Oia caldera hike
    aspect: 16/7
    variant: inset

  - type: sights
    items:
      - name: Oia Castle (Agios Nikolaos)
        description: 15th-century Venetian fortress ruins. The sunset spot — arrive early.
        map: Castle of Oia Agios Nikolaos Santorini
      - name: Fira to Oia Hike
        description: ~10 km caldera rim trail. Very little shade — go early, bring water.
        map: Fira to Oia Hike Santorini
      - name: Akrotiri
        description: Bronze Age settlement — the “Pompeii of the Aegean.” Over 3,500 years old.
        actions:
          - kind: map
            label: Map
            map: Akrotiri Archaeological Site Santorini
            icon: 📍
          - kind: ticket
            label: Official tickets
            url: https://hhticket.gr/
            icon: 🎟️
      - name: Ancient Thira
        description: Hellenistic ruins on a ridge between Kamari and Perissa beaches.
        actions:
          - kind: map
            label: Map
            map: Ancient Thera Santorini
            icon: 📍
          - kind: ticket
            label: Official tickets
            url: https://hhticket.gr/
            icon: 🎟️
      - name: Museums in Fira
        description: Good indoor stop before or after Akrotiri.
        links:
          - label: Fira
            map: Fira Santorini
          - label: Museum of Prehistoric Thera
            map: Museum of Prehistoric Thera Fira
          - label: Archaeological Museum of Thera
            map: Archaeological Museum of Thera Fira
      - name: Red & White Beach
        description: Dramatic colored cliffs. Red Beach on foot, White Beach by boat.
        links:
          - label: Red Beach
            map: Red Beach Santorini
          - label: White Beach
            map: White Beach Santorini
      - name: Ammoudi Bay
        description: Hidden harbor below Oia. Hike or donkey down for swimming and seafood.
        map: Ammoudi Bay Santorini

  - type: heading
    text: Eat & Drink

  - type: venues
    items:
      - icon: 🥙
        name: Yogi Gyro
        description: In Fira — best gyros on the island.
        map: Yogi Gyro Santorini
      - icon: 🌅
        name: PK Cocktail Bar
        description: The spot for sunset drinks.
        map: PK Cocktail Bar Santorini

aside:
  - variant: essentials
    title: 🌅 Essentials
    items:
      - Stay in [Oia](map:Oia Santorini) for iconic sunset views
      - Book caldera-view hotels early
      - Hike [Fira → Oia](map:Fira to Oia Hike Santorini) (10 km, go early)
      - Visit [Akrotiri](map:Akrotiri Archaeological Site Santorini) archaeological site
      - "Sunset drinks: [PK Cocktail Bar](map:PK Cocktail Bar Santorini)"
      - "Best gyros: [Yogi Gyro](map:Yogi Gyro Santorini) in [Fira](map:Fira Santorini)"

  - variant: ferry
    title: 🚢 Getting There
    items:
      - "Ferry from Piraeus: ~8 hrs (overnight)"
      - "High-speed ferry: ~5 hrs"
      - "Flight: ~45 min from ATH"
