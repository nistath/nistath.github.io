id: crete
order: 60
kind: island
nav:
  label: Crete
  icon: 🏔️
title: Crete
tagline: The largest island — feels like its own country
image:
  src: https://commons.wikimedia.org/wiki/Special:FilePath/Chania_-_Venetian_harbor_1.jpg?width=900
  alt: Chania Venetian harbor, Crete
  aspect: 16/9

body:
  - type: prose
    text: Gorges, beaches, Venetian harbors, ancient palaces, incredible food. Plan at least a full week.

  - type: heading
    text: Getting There

  - type: chips
    items:
      - text: ✈️ Chania (CHQ)
        map: Chania Crete
      - text: ✈️ Heraklion (HER)
        map: Heraklion Crete
      - text: ⛴ Overnight ferry

  - type: heading
    text: Where to Stay

  - type: prose
    text: >-
      [**Chania**](map:Chania Crete) (west) — Lively Venetian harbor town, best base for the gorge and beaches. Try [**Riviera Suites**](map:Riviera Suites Chania). [**Elounda**](map:Elounda Crete) (northeast) — Quieter, upscale, closer to Knossos and Spinalonga. These are opposite ends of the island — pick one based on your itinerary.

  - type: heading
    text: Things to Do

  - type: image
    src: https://commons.wikimedia.org/wiki/Special:FilePath/Samaria_Gorge_05.jpg?width=900
    alt: Samaria Gorge
    aspect: 16/7
    variant: inset

  - type: sights
    items:
      - name: Samariá Gorge
        description: ~16 km, one of Europe’s longest. Full day. Book a tour bus from Chania.
        map: Samaria Gorge Crete
      - name: Elafonisi Beach
        description: Pink-sand lagoon. Almost tropical. Dedicate a full day.
        map: Elafonisi Beach Crete
      - name: Palace of Knossos
        description: Center of Minoan civilization, home of the labyrinth. Get a guide.
        actions:
          - kind: map
            label: Map
            map: Palace of Knossos Crete
            icon: 📍
          - kind: ticket
            label: Official tickets
            url: https://hhticket.gr/
            icon: 🎟️
      - name: Heraklion Archaeological Museum
        description: Finest Minoan collection in the world.
        actions:
          - kind: map
            label: Map
            map: Heraklion Archaeological Museum
            icon: 📍
          - kind: ticket
            label: Official tickets
            url: https://hhticket.gr/
            icon: 🎟️
      - name: Fortezza (Rethymno)
        description: Venetian fortress. Stop for a visit and lunch between Heraklion and Chania.
        map: Fortezza of Rethymno
      - name: Firka Fortress (Chania)
        description: At Chania’s old harbor entrance. Great views.
        map: Firka Fortress Chania
      - name: Spinalonga
        description: Fortified island near Elounda. Short boat trip to explore.
        map: Spinalonga Crete

  - type: heading
    text: Eat & Drink

  - type: venues
    items:
      - icon: 🥐
        name: Red Jane Bakery
        description: Best bakery in Chania.
        map: Red Jane Bakery Chania
      - icon: 🍸
        name: Sinagogi
        description: Best bar in Chania.
        map: Sinagogi bar Chania

  - type: note
    text: We’ve barely scratched the surface. Do your own research — or better yet, ask a local.

aside:
  - variant: essentials
    title: 🏔 Essentials
    items:
      - Plan at least a full week
      - Base in [Chania](map:Chania Crete) — try [Riviera Suites](map:Riviera Suites Chania)
      - Book [Samariá Gorge](map:Samaria Gorge Crete) tour the day before
      - "Best bar in [Chania](map:Chania Crete): [Sinagogi](map:Sinagogi bar Chania)"

  - variant: ferry
    title: 🚢 Getting There
    items:
      - Fly to [Chania](map:Chania Crete) (CHQ) or [Heraklion](map:Heraklion Crete) (HER)
      - Overnight ferry from Piraeus — get a cabin

  - variant: logistics
    title: 🗺 Logistics
    facts:
      - term: Car hire
        description: essential to explore
      - term: "[Chania](map:Chania Crete) ↔ [Heraklion](map:Heraklion Crete)"
        description: 2.5 hrs by car
      - term: "[Elounda](map:Elounda Crete)"
        description: 1.5 hrs from Heraklion
