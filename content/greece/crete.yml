id: crete
order: 60
kind: island
nav:
  label: Crete
  icon: 🏔️
title: Crete
tagline: The largest island — feels like its own country
image:
  src: https://commons.wikimedia.org/wiki/Special:FilePath/Chania_-_Venetian_harbor_1.jpg?width=900
  alt: Chania Venetian harbor, Crete
  aspect: 16/9

body:
  - type: prose
    text: Gorges, beaches, Venetian harbors, ancient palaces, incredible food. Plan at least a full week.

  - type: heading
    text: Getting There

  - type: chips
    items:
      - text: ✈️ Chania (CHQ)
        url: https://www.google.com/maps/search/?api=1&query=Chania+Crete
      - text: ✈️ Heraklion (HER)
        url: https://www.google.com/maps/search/?api=1&query=Heraklion+Crete
      - text: ⛴ Overnight ferry

  - type: heading
    text: Where to Stay

  - type: prose
    text: >-
      [**Chania**](https://www.google.com/maps/search/?api=1&query=Chania+Crete) (west) — Lively Venetian harbor town, best base for the gorge and beaches. Try [**Riviera Suites**](https://www.google.com/maps/search/?api=1&query=Riviera+Suites+Chania). [**Elounda**](https://www.google.com/maps/search/?api=1&query=Elounda+Crete) (northeast) — Quieter, upscale, closer to Knossos and Spinalonga. These are opposite ends of the island — pick one based on your itinerary.

  - type: heading
    text: Things to Do

  - type: image
    src: https://commons.wikimedia.org/wiki/Special:FilePath/Samaria_Gorge_05.jpg?width=900
    alt: Samaria Gorge
    aspect: 16/7
    variant: inset

  - type: sights
    items:
      - name: Samariá Gorge
        description: ~16 km, one of Europe’s longest. Full day. Book a tour bus from Chania.
        url: https://www.google.com/maps/search/?api=1&query=Samaria+Gorge+Crete
      - name: Elafonisi Beach
        description: Pink-sand lagoon. Almost tropical. Dedicate a full day.
        url: https://www.google.com/maps/search/?api=1&query=Elafonisi+Beach+Crete
      - name: Palace of Knossos
        description: Center of Minoan civilization, home of the labyrinth. Get a guide.
        actions:
          - kind: map
            label: Map
            url: https://www.google.com/maps/search/?api=1&query=Palace+of+Knossos+Crete
            icon: 📍
          - kind: ticket
            label: Official tickets
            url: https://hhticket.gr/
            icon: 🎟️
      - name: Heraklion Archaeological Museum
        description: Finest Minoan collection in the world.
        actions:
          - kind: map
            label: Map
            url: https://www.google.com/maps/search/?api=1&query=Heraklion+Archaeological+Museum
            icon: 📍
          - kind: ticket
            label: Official tickets
            url: https://hhticket.gr/
            icon: 🎟️
      - name: Fortezza (Rethymno)
        description: Venetian fortress. Stop for a visit and lunch between Heraklion and Chania.
        url: https://www.google.com/maps/search/?api=1&query=Fortezza+of+Rethymno
      - name: Firka Fortress (Chania)
        description: At Chania’s old harbor entrance. Great views.
        url: https://www.google.com/maps/search/?api=1&query=Firka+Fortress+Chania
      - name: Spinalonga
        description: Fortified island near Elounda. Short boat trip to explore.
        url: https://www.google.com/maps/search/?api=1&query=Spinalonga+Crete

  - type: heading
    text: Eat & Drink

  - type: venues
    items:
      - icon: 🥐
        name: Red Jane Bakery
        description: In Chania — don’t skip it.
        url: https://www.google.com/maps/search/?api=1&query=Red+Jane+Bakery+Chania
      - icon: 🍸
        name: Sinagogi
        description: Best bar in Chania.
        url: https://www.google.com/maps/search/?api=1&query=Sinagogi+bar+Chania

  - type: note
    text: We’ve barely scratched the surface. Do your own research — or better yet, ask a local.

aside:
  - variant: essentials
    title: 🏔 Essentials
    items:
      - Plan at least a full week
      - Base in [Chania](https://www.google.com/maps/search/?api=1&query=Chania+Crete) — try [Riviera Suites](https://www.google.com/maps/search/?api=1&query=Riviera+Suites+Chania)
      - Book [Samariá Gorge](https://www.google.com/maps/search/?api=1&query=Samaria+Gorge+Crete) tour the day before
      - Red Jane Bakery — don’t skip it
      - "Best bar in [Chania](https://www.google.com/maps/search/?api=1&query=Chania+Crete): [Sinagogi](https://www.google.com/maps/search/?api=1&query=Sinagogi+bar+Chania)"

  - variant: ferry
    title: 🚢 Getting There
    items:
      - Fly to [Chania](https://www.google.com/maps/search/?api=1&query=Chania+Crete) (CHQ) or [Heraklion](https://www.google.com/maps/search/?api=1&query=Heraklion+Crete) (HER)
      - Overnight ferry from Piraeus — get a cabin

  - variant: logistics
    title: 🗺 Logistics
    facts:
      - term: Car hire
        description: essential to explore
      - term: "[Chania](https://www.google.com/maps/search/?api=1&query=Chania+Crete) ↔ [Heraklion](https://www.google.com/maps/search/?api=1&query=Heraklion+Crete)"
        description: 2.5 hrs by car
      - term: "[Elounda](https://www.google.com/maps/search/?api=1&query=Elounda+Crete)"
        description: 1.5 hrs from Heraklion
