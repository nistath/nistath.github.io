      - term: Currency
        description: Euro (€)
      - term: Language
        description: Greek
      - term: SIM cards
        description: At airport arrivals

  - variant: tips
    title: 💡 Pro Tips
    items:
      - Validate your metro ticket before boarding
      - FreeNow usually beats Uber on price & availability
      - Hotels in [Plaka](https://www.google.com/maps/search/?api=1&query=Plaka+Athens) are walkable to almost everything
      - Most restaurants open for dinner at 8–9 PM
      - Book island ferries at [ferryscanner.com](https://ferryscanner.com)
