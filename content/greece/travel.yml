        description: Eleftherios Venizelos (ATH)
      - term: Metro to centre
        description: ~40 min
      - term: Taxi flat rate
        description: ~€40 by day, more at night
      - term: Currency
        description: Euro (€)
      - term: Language
        description: Greek
      - term: SIM cards
        description: At airport arrivals

  - variant: tips
    title: 💡 Pro Tips
    items:
      - Validate your metro ticket before boarding
      - FreeNow usually beats Uber on price & availability
      - Hotels in [Plaka](map:Plaka Athens) are walkable to almost everything
      - Greeks eat dinner at 9–10 PM; show up at 7 and you’ll have the room to yourself
      - Book island ferries at [ferryscanner.com](https://ferryscanner.com)
