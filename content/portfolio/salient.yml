title: SALIENT
subtitle: Distributed multi-GPU graph neural network acceleration
org: MIT-IBM Watson AI Lab
period: 2020 – 2021
tags:
  - PyTorch
  - C++
  - CUDA
  - Distributed Systems
  - GNNs
  - MLSys 2022
bullets:
  - Led design and implementation of SALIENT, a distributed multi-GPU system for training and inference of graph neural networks (GNNs) on massive graphs.
  - Achieves a drop-in **3× performance improvement** over an optimized PyTorch Geometric baseline, with notable speedups over competing distributed systems.
  - Optimized PyG’s C++ neighborhood sampling code and designed a GIL-free thread-based parallelization strategy for non-blocking data loading.
  - Co-authored _Accelerating Training and Inference of Graph Neural Networks with Fast Sampling and Pipelining_, presented at **MLSys 2022** and featured in MIT News.
