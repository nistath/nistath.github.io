bullets:
  - Led and coordinated 8 engineers across 9 software subsystems of MIT’s electric race car.
  - The car finished the 22 km Formula SAE Electric 2018 endurance race **113 seconds ahead** of the next fastest competitor.
  - Built _CANlib_ — a code-generated CAN bus serialization library — alongside Makefile improvements, automated toolchain installation, and Git-versioned binary flashing.
  - Developed documentation, unit and integration tests, and verification procedures for the car’s electrical systems.
  - Held regular individual status reviews and all-hands architecture sessions.
