heading: Hello!

paragraphs:
  - >-
    You have reached my personal webpage. It was hastily hand-coded in
    2017 and further vibe-coded in 2026, though I assure you this prose is
    all painstakingly handwritten.
  - >-
    My place of employment is OpenAI, where I design LLMs, train them on
    massive supercomputers, and help get them deployed in case they are
    useful to you.
  - >-
    I hail from Greece and now live with my partner in the Mission
    District of San Francisco. In my spare time, I go on long walks with
    friends, cycle, and lift weights – but all of that is really only
    cross-training for my Brazilian Jiu-Jitsu competitions.
  - >-
    Previously, I worked on high-frequency trading, on
    [high](https://www.linkedin.com/posts/lukekulik_ces2023-activity-7017864526037487616-Ebcb)-[speed](https://youtu.be/EZ0pnAGQmGI?t=16127)
    [autonomous](https://youtu.be/gcnngFyWnFQ?t=4419)
    [racecars](https://www.facebook.com/mitfsae/videos/10155235513547131/),
    and on
    [high-performance machine learning](https://proceedings.mlsys.org/paper/2022/hash/35f4a8d465e6e1edc05f3d8ab658c551-Abstract.html).

farewell: Take a looksie and have a nice day!
